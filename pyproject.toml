[project]
name = "ml-foundations"
version = "0.1.0"
description = "A hands-on portfolio of machine-learning foundations implemented from first principles."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
